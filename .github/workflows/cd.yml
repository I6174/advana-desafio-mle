name: Continuous Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/latam-delay-api:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/latam-delay-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy latam-delay-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/latam-delay-api:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated